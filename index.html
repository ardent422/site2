<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой первый сайт</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #eef2ff;
      color: #1f2937;
    }

    main {
      width: min(90%, 420px);
      padding: 32px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 10px 30px #1f293720;
      text-align: center;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    #message {
      color: #4f46e5;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>Мой первый сайт</h1>
    <p>Введите своё имя:</p>

    <form id="greeting-form">
      <input id="name" type="text" placeholder="Ваше имя" required>
      <button type="submit">Поздороваться</button>
    </form>

    <p id="message"></p>
  </main>

  <script>
    document.querySelector("#greeting-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const name = document.querySelector("#name").value.trim();
      document.querySelector("#message").textContent = `Привет, ${name}!`;
    });
  </script>
</body>
</html>
